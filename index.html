<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#6366F1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Learn English for Kids 🌟</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
/* ════════════════════════════════════════
   TOKENS
════════════════════════════════════════ */
:root {
  --bg:        #0D1117;
  --surface:   #161B22;
  --card:      #1C2230;
  --border:    #30363D;
  --text:      #F0F6FC;
  --muted:     #8B949E;
  --accent:    #6366F1;
  --accent2:   #818CF8;
  --green:     #22C55E;
  --red:       #EF4444;
  --gold:      #F59E0B;
  --radius:    18px;
  --font:      'Nunito', sans-serif;
  --safe-bot:  env(safe-area-inset-bottom, 0px);
}

/* ════════════════════════════════════════
   RESET & BASE
════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font); cursor: pointer; border: none; outline: none; }

/* ════════════════════════════════════════
   LAYOUT SHELL
════════════════════════════════════════ */
#app {
  display: flex; flex-direction: column;
  height: 100dvh; max-width: 500px;
  margin: 0 auto; position: relative;
  overflow: hidden;
}

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
#app-title {
  font-size: 17px; font-weight: 900; color: var(--text);
  letter-spacing: -0.3px; flex: 1;
}
#stars-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(245,158,11,0.15);
  border: 1px solid rgba(245,158,11,0.4);
  border-radius: 20px; padding: 4px 12px;
  font-size: 13px; font-weight: 800; color: var(--gold);
}

/* ── Category Bar ── */
#catbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 0;
}
#catbar-scroll {
  display: flex; gap: 8px;
  overflow-x: auto; padding: 0 16px;
  scrollbar-width: none;
}
#catbar-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0;
  background: var(--card); color: var(--muted);
  border: 1.5px solid var(--border);
  border-radius: 20px; padding: 6px 14px;
  font-size: 13px; font-weight: 700;
  transition: all .2s;
  white-space: nowrap;
}
.cat-btn.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent);
}

/* ── Pages ── */
#pages {
  flex: 1; overflow: hidden; position: relative;
}
.page {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(80px + var(--safe-bot));
}
.page.active { display: flex; }
.page::-webkit-scrollbar { display: none; }

/* ════════════════════════════════════════
   VOCAB PAGE
════════════════════════════════════════ */
#vocab-page { align-items: center; padding: 16px 16px 0; }

#card-wrap {
  width: 100%; max-width: 420px;
  position: relative; border-radius: 24px;
  overflow: hidden; touch-action: pan-y;
  flex-shrink: 0;
}
#card-canvas {
  width: 100%; display: block;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

#word-display {
  margin-top: 18px;
  font-size: 48px; font-weight: 900;
  text-align: center; letter-spacing: -1px;
  line-height: 1.1;
}

#word-sub {
  font-size: 15px; color: var(--muted); font-weight: 600;
  text-align: center; margin-top: 4px;
}

#vocab-controls {
  display: flex; gap: 12px; margin-top: 18px;
  width: 100%; max-width: 420px;
}
#vocab-controls button {
  flex: 1; height: 52px; border-radius: 14px;
  font-size: 15px; font-weight: 800;
  transition: all .15s; active-scale: .96;
}
#vocab-controls button:active { transform: scale(.96); }

#btn-prev  { background: rgba(239,68,68,.15); color: #F87171; border: 1.5px solid rgba(239,68,68,.3); }
#btn-listen { background: var(--accent); color: #fff; }
#btn-next  { background: rgba(34,197,94,.15); color: #4ADE80; border: 1.5px solid rgba(34,197,94,.3); }

#btn-mastered {
  width: 100%; max-width: 420px;
  height: 48px; border-radius: 14px;
  margin-top: 10px;
  font-size: 15px; font-weight: 800;
  background: rgba(245,158,11,.15); color: var(--gold);
  border: 1.5px solid rgba(245,158,11,.35);
  transition: all .15s;
}
#btn-mastered:active { transform: scale(.97); }
#btn-mastered.done { opacity: .5; pointer-events: none; }

#vocab-progress {
  display: flex; align-items: center; gap: 10px;
  width: 100%; max-width: 420px; margin-top: 14px;
}
#vocab-progress-bar {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--border); overflow: hidden;
}
#vocab-progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), #C084FC);
  transition: width .4s ease;
}
#vocab-progress-label {
  font-size: 12px; font-weight: 700; color: var(--muted);
  white-space: nowrap;
}

/* ════════════════════════════════════════
   PRACTICE PAGE
════════════════════════════════════════ */
#practice-page { padding: 16px; gap: 12px; }

#practice-topic-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 4px; flex-shrink: 0;
  scrollbar-width: none;
}
#practice-topic-scroll::-webkit-scrollbar { display: none; }
.topic-btn {
  flex-shrink: 0; background: var(--card); color: var(--muted);
  border: 1.5px solid var(--border); border-radius: 20px;
  padding: 6px 14px; font-size: 13px; font-weight: 700;
  transition: all .2s; white-space: nowrap;
}
.topic-btn.active { background: #22C55E; color: #fff; border-color: #22C55E; }

#practice-progress {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
#practice-progress-bar {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--border); overflow: hidden;
}
#practice-progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #22C55E, #86EFAC);
  transition: width .4s ease;
}
#practice-progress-label {
  font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap;
}

#prompt-card {
  background: var(--surface); border: 2px solid var(--border);
  border-radius: 20px; padding: 24px 20px;
  font-size: 22px; font-weight: 900; text-align: center;
  line-height: 1.4; flex-shrink: 0;
  min-height: 100px; display: flex; align-items: center; justify-content: center;
}
#prompt-card .blank {
  display: inline-block; min-width: 80px;
  border-bottom: 3px solid var(--accent);
  color: var(--accent2); padding: 0 4px;
}

#feedback-row {
  text-align: center; font-size: 17px; font-weight: 800;
  min-height: 28px; flex-shrink: 0;
  transition: all .2s;
}

#choices-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; flex-shrink: 0;
}
.choice-btn {
  height: 58px; border-radius: 14px;
  font-size: 15px; font-weight: 800;
  background: var(--card); color: var(--text);
  border: 2px solid var(--border);
  transition: all .15s;
}
.choice-btn:active { transform: scale(.96); }
.choice-btn.correct { background: rgba(34,197,94,.2); border-color: #22C55E; color: #4ADE80; }
.choice-btn.wrong   { background: rgba(239,68,68,.2); border-color: #EF4444; color: #F87171; }

#practice-nav {
  display: flex; gap: 12px; flex-shrink: 0;
}
#practice-nav button {
  flex: 1; height: 50px; border-radius: 14px;
  font-size: 15px; font-weight: 800;
  transition: all .15s;
}
#practice-nav button:active { transform: scale(.96); }
#btn-practice-prev { background: rgba(239,68,68,.15); color: #F87171; border: 1.5px solid rgba(239,68,68,.3); }
#btn-practice-listen { background: var(--accent); color: #fff; }
#btn-practice-next { background: rgba(34,197,94,.15); color: #4ADE80; border: 1.5px solid rgba(34,197,94,.3); }

/* ════════════════════════════════════════
   PROGRESS PAGE
════════════════════════════════════════ */
#progress-page { padding: 16px; gap: 14px; }

#level-banner {
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  border: 1.5px solid rgba(99,102,241,.4);
  border-radius: 20px; padding: 20px;
  display: flex; flex-direction: column; gap: 10px;
}
#level-title {
  font-size: 28px; font-weight: 900;
  background: linear-gradient(90deg, #818CF8, #C084FC);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#xp-bar-wrap { height: 10px; background: rgba(255,255,255,.1); border-radius: 5px; overflow: hidden; }
#xp-bar-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, #818CF8, #C084FC);
  transition: width .6s ease;
}
#xp-label { font-size: 12px; color: #A5B4FC; font-weight: 700; }

.prog-section-title {
  font-size: 15px; font-weight: 900; color: var(--accent2);
  text-transform: uppercase; letter-spacing: .5px;
}

.prog-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px;
}
.prog-row-top { display: flex; justify-content: space-between; align-items: center; }
.prog-row-label { font-size: 14px; font-weight: 700; }
.prog-row-count { font-size: 13px; font-weight: 800; }
.prog-mini-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.prog-mini-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

/* ════════════════════════════════════════
   BOTTOM NAV
════════════════════════════════════════ */
#bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(64px + var(--safe-bot));
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start;
  padding-top: 6px; z-index: 20;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  background: none; padding: 6px 4px;
  font-size: 11px; font-weight: 700; color: var(--muted);
  transition: color .2s;
}
.nav-btn .nav-icon { font-size: 22px; line-height: 1; transition: transform .2s; }
.nav-btn.active { color: var(--accent2); }
.nav-btn.active .nav-icon { transform: scale(1.15); }

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 30px; padding: 10px 20px;
  font-size: 15px; font-weight: 800;
  opacity: 0; pointer-events: none;
  transition: all .3s; z-index: 100;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════════════════════════════════════════
   ANIMATIONS
════════════════════════════════════════ */
@keyframes pop {
  0%   { transform: scale(.9); opacity: 0; }
  60%  { transform: scale(1.04); }
  100% { transform: scale(1); opacity: 1; }
}
.pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1) both; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-6px); }
  75%     { transform: translateX(6px); }
}
.shake { animation: shake .3s ease both; }

/* Swipe hint */
#swipe-hint {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,255,255,.3); font-weight: 600;
  pointer-events: none;
}
</style>
</head>

      <div id="practice-prog-rows"></div>
    </div>

  </div><!-- /pages -->

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-page="vocab">

    </button>
    <button class="nav-btn" data-page="practice">

    </button>
    <button class="nav-btn" data-page="progress">
      <span class="nav-icon">📊</span>Progress
    </button>
  </nav>

</div><!-- /app -->

<div id="toast"></div>

// ════════════════════════════════════════
//  TTS — Web Speech API
// ════════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88; u.pitch = 1.05; u.volume = 1;
  // prefer female voice
  const voices = speechSynthesis.getVoices();
  const female = voices.find(v => /female|zira|samantha|karen|moira/i.test(v.name));
  if (female) u.voice = female;
  speechSynthesis.speak(u);
}
// Voices may load async
speechSynthesis.onvoiceschanged = () => {};

// ════════════════════════════════════════
//  CANVAS CARD RENDERER
// ════════════════════════════════════════
const canvas  = document.getElementById("card-canvas");
const ctx     = canvas.getContext("2d");

function drawCard(entry) {
  const W = 420, H = 260;
  canvas.width = W; canvas.height = H;

  // Gradient background
  const grd = ctx.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, entry.g1);
  grd.addColorStop(1, entry.g2);
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, 0, 0, W, H, 24);
  ctx.fillStyle = grd; ctx.fill();

  // Decorative circles
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath(); ctx.arc(W/2, H/2, 90, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.beginPath(); ctx.arc(W/2, H/2, 130, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Emoji
  ctx.font = "130px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(entry.emoji, W/2, H/2 + 4);
}

function roundRect(c, x, y, w, h, r) {
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

//  VOCAB STATE
// ════════════════════════════════════════
const vocabKeys = Object.keys(VOCABULARY);
let vCat   = vocabKeys[0];
let vIndex = 0;

function buildCatBar() {
  const scroll = document.getElementById("catbar-scroll");
  scroll.innerHTML = "";
  vocabKeys.forEach(cat => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (cat === vCat ? " active" : "");
    b.textContent = cat;
    b.onclick = () => { vCat = cat; vIndex = 0; buildCatBar(); loadVocab(); };
    scroll.appendChild(b);
  });
  // Scroll active into view
  const active = scroll.querySelector(".cat-btn.active");
  if (active) active.scrollIntoView({inline:"center", behavior:"smooth"});
}

function loadVocab() {
  const words = VOCABULARY[vCat];
  const entry = words[vIndex];
  const total = words.length;

  // Card
  drawCard(entry);
  document.getElementById("card-canvas").classList.remove("pop");
  void document.getElementById("card-canvas").offsetWidth;
  document.getElementById("card-canvas").classList.add("pop");

  // Word
  document.getElementById("word-display").textContent = entry.word;
  document.getElementById("word-sub").textContent = `${vCat}  ·  ${vIndex + 1} of ${total}`;

  // Progress bar
  const pct = ((vIndex + 1) / total * 100).toFixed(1);
  document.getElementById("vocab-progress-fill").style.width = pct + "%";
  document.getElementById("vocab-progress-label").textContent = `${vIndex+1} / ${total}`;

  // Mastered button
  const masteredList = progress.mastered[vCat] || [];
  const done = masteredList.includes(entry.word);
  const mb = document.getElementById("btn-mastered");
  mb.textContent = done ? "✅ Already Mastered!" : "⭐ Mark as Mastered";
  mb.classList.toggle("done", done);

  speak(entry.word);
}

document.getElementById("btn-prev").onclick = () => {
  vIndex = (vIndex - 1 + VOCABULARY[vCat].length) % VOCABULARY[vCat].length;
  loadVocab();
};
document.getElementById("btn-next").onclick = () => {
  vIndex = (vIndex + 1) % VOCABULARY[vCat].length;
  loadVocab();
};
document.getElementById("btn-listen").onclick = () => speak(VOCABULARY[vCat][vIndex].word);
document.getElementById("btn-mastered").onclick = () => {
  const word = VOCABULARY[vCat][vIndex].word;
  const list = progress.mastered[vCat] = progress.mastered[vCat] || [];
  if (!list.includes(word)) {
    list.push(word); addStars(2);
    showToast("⭐ +2 stars! Mastered: " + word);
    loadVocab();
  }
};

// ── Swipe on canvas ──
let swipeStartX = 0;
canvas.addEventListener("touchstart", e => { swipeStartX = e.touches[0].clientX; }, {passive:true});
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - swipeStartX;
  if (Math.abs(dx) > 40) {
    if (dx < 0) document.getElementById("btn-next").click();
    else         document.getElementById("btn-prev").click();
  }
}, {passive:true});

  const scroll = document.getElementById("practice-topic-scroll");
  scroll.innerHTML = "";
  practiceKeys.forEach(t => {
    const b = document.createElement("button");
    b.className = "topic-btn" + (t === pTopic ? " active" : "");
    b.textContent = t;
    b.onclick = () => { pTopic = t; pIndex = 0; buildTopicBar(); loadPractice(); };
    scroll.appendChild(b);
  });
  const active = scroll.querySelector(".topic-btn.active");
  if (active) active.scrollIntoView({inline:"center", behavior:"smooth"});
}

function loadPractice() {
  const items = PRACTICE[pTopic];
  const item  = items[pIndex];
  const total = items.length;
  pLocked = true;

  // Progress
  document.getElementById("practice-progress-fill").style.width = ((pIndex+1)/total*100).toFixed(1)+"%";
  document.getElementById("practice-progress-label").textContent = `${pIndex+1} / ${total}`;

  // Prompt — highlight blank
  const html = item.prompt.replace("__", '<span class="blank">____</span>');
  document.getElementById("prompt-card").innerHTML = html;

  // Feedback reset
  const fb = document.getElementById("feedback-row");
  fb.textContent = "Choose the correct word";
  fb.style.color = "var(--muted)";

  // Shuffle choices
  const shuffled = [...item.choices].sort(() => Math.random() - .5);
  const grid = document.getElementById("choices-grid");
  grid.innerHTML = "";
  shuffled.forEach(choice => {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.textContent = choice;
    b.onclick = () => handleChoice(b, choice, item);
    grid.appendChild(b);
  });

  speak(item.prompt.replace("__", "blank"));
}

function handleChoice(btn, choice, item) {
  if (!pLocked) return;
  const correct = choice.trim() === item.answer.trim();
  const fb = document.getElementById("feedback-row");

  if (correct) {
    btn.classList.add("correct");
    fb.textContent = "✅ Correct! Well done!";
    fb.style.color = "#4ADE80";
    const done = progress.practice_done[pTopic] = progress.practice_done[pTopic] || [];
    if (!done.includes(pIndex)) { done.push(pIndex); addStars(3); showToast("🎉 +3 stars!"); }
    pLocked = false;
    speak(item.say);
  } else {
    btn.classList.add("wrong");
    btn.classList.add("shake");
    setTimeout(() => btn.classList.remove("shake"), 400);
    fb.textContent = "❌ Try again!";
    fb.style.color = "#F87171";
    speak("Try again");
  }
}

document.getElementById("btn-practice-prev").onclick = () => {
  pIndex = (pIndex - 1 + PRACTICE[pTopic].length) % PRACTICE[pTopic].length;
  loadPractice();
};
document.getElementById("btn-practice-next").onclick = () => {
  if (pLocked) { showToast("Choose an answer first!"); return; }
  pIndex = (pIndex + 1) % PRACTICE[pTopic].length;
  loadPractice();
};
document.getElementById("btn-practice-listen").onclick = () => {
  speak(PRACTICE[pTopic][pIndex].prompt.replace("__","blank"));
};

// ════════════════════════════════════════
//  PROGRESS PAGE
// ════════════════════════════════════════
function renderProgress() {
  const stars = progress.stars;
  const level = Math.floor(stars / 20) + 1;
  const toNext = 20 - (stars % 20);
  const xpPct  = (stars % 20) / 20 * 100;

  document.getElementById("level-title").textContent = `🌟 Level ${level}  —  ${stars} Stars`;
  document.getElementById("xp-bar-fill").style.width = xpPct + "%";
  document.getElementById("xp-label").textContent = `${toNext} stars to Level ${level + 1}`;

  // Vocab rows
  const vr = document.getElementById("vocab-prog-rows");
  vr.innerHTML = "";
  vocabKeys.forEach(cat => {
    const total    = VOCABULARY[cat].length;
    const mastered = (progress.mastered[cat] || []).length;
    vr.appendChild(makeProgRow(cat, mastered, total, "#6366F1"));
  });

  // Practice rows
  const pr = document.getElementById("practice-prog-rows");
  pr.innerHTML = "";
  practiceKeys.forEach(t => {
    const total = PRACTICE[t].length;
    const done  = (progress.practice_done[t] || []).length;
    pr.appendChild(makeProgRow(t, done, total, "#22C55E"));
  });
}

function makeProgRow(label, done, total, color) {
  const pct = total ? Math.round(done/total*100) : 0;
  const div = document.createElement("div");
  div.className = "prog-row";
  div.innerHTML = `
    <div class="prog-row-top">
      <span class="prog-row-label">${label}</span>
      <span class="prog-row-count" style="color:${color}">${done}/${total} (${pct}%)</span>
    </div>
    <div class="prog-mini-bar">
      <div class="prog-mini-fill" style="width:${pct}%;background:${color}"></div>
    </div>`;
  return div;
}

// ════════════════════════════════════════
//  PAGE NAVIGATION
// ════════════════════════════════════════
const pageMap = {
  vocab: document.getElementById("vocab-page"),
  practice: document.getElementById("practice-page"),
  progress: document.getElementById("progress-page"),
};
const catbar = document.getElementById("catbar");

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.onclick = () => {
    const pg = btn.dataset.page;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    Object.entries(pageMap).forEach(([k, el]) => el.classList.toggle("active", k === pg));

    // Show/hide catbar
    catbar.style.display = pg === "vocab" ? "" : "none";

    if (pg === "progress") renderProgress();
  };
});

// ════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// ════════════════════════════════════════
//  KEYBOARD (desktop)
// ════════════════════════════════════════
document.addEventListener("keydown", e => {
  const active = document.querySelector(".nav-btn.active")?.dataset.page;
  if (active === "vocab") {
    if (e.key === "ArrowRight" || e.key === "d") document.getElementById("btn-next").click();
    if (e.key === "ArrowLeft"  || e.key === "a") document.getElementById("btn-prev").click();
    if (e.key === " ") { e.preventDefault(); speak(VOCABULARY[vCat][vIndex].word); }
    if (e.key === "m" || e.key === "M") document.getElementById("btn-mastered").click();
  } else if (active === "practice") {
    if (e.key === "ArrowRight") document.getElementById("btn-practice-next").click();
    if (e.key === "ArrowLeft")  document.getElementById("btn-practice-prev").click();
    if (e.key === " ") { e.preventDefault(); document.getElementById("btn-practice-listen").click(); }
  }
});

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
updateStarsPill();
buildCatBar();
loadVocab();
buildTopicBar();
loadPractice();

// ── Service Worker ──
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
